<!DOCTYPE html>
<html>
<head>
<title>Pulse BP Prediction</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<style>
    body{
    font-family: Arial;
    text-align: center;
    background: #f4f6f9;
}

h1{
    color: #333;
}

form{
    background: white;
    padding: 20px;
    margin: auto;
    width: 300px;
    border-radius: 10px;
}

input{
    width: 90%;
    padding: 8px;
    margin: 8px;
}

button{
    padding: 10px;
    background: blue;
    color: white;
    border: none;
    border-radius: 5px;
}
</style>
</style><body>

<h1>Predictive Pulse Blood Pressure Analysis</h1>

<form action="/predict" method="post">

<label>Age</label>
<input type="number" name="age" required>

<label>Pulse Rate</label>
<input type="number" name="pulse" required>

<label>Weight (kg)</label>
<input type="number" name="weight" required>

<label>Height (cm)</label>
<input type="number" name="height" required>

<button type="submit">Predict</button>

</form>

<h2>{{ prediction_text }}</h2>

</body>
</html>
